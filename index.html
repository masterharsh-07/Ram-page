<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>॥ श्री राम ॥ | Jai Shree Ram</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- =====================================
         START SCREEN
         Appears when QR code opens the page
    ====================================== -->

    <div id="startScreen" class="start-screen">

        <div class="start-content">

            <div class="start-om">ॐ</div>

            <h1>॥ श्री राम ॥</h1>

            <p>जय श्री राम 🙏</p>

            <div class="start-diya">
                🪔
            </div>

            <button id="startButton" class="start-button">
                दर्शनासाठी स्पर्श करा
            </button>

            <small>
                संगीतासह दर्शन
            </small>

        </div>

    </div>


    <!-- =====================================
         BACKGROUND MUSIC
    ====================================== -->

    <audio id="bgMusic" loop preload="auto">
        <source src="./audio.mp3" type="audio/mpeg">
    </audio>


    <!-- =====================================
         MAIN PAGE
    ====================================== -->

    <div class="page" id="mainPage">

        <!-- Background -->

        <div class="background-glow"></div>

        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>


        <!-- =================================
             HEADER
        ================================== -->

        <header class="header">

            <div class="om">
                ॐ
            </div>

            <h1>
                ॥ श्री राम ॥
            </h1>

            <p>
                जय श्री राम 🙏
            </p>

        </header>


        <!-- =================================
             SLIDESHOW
        ================================== -->

        <main class="slideshow-wrapper">

            <div class="slideshow" id="slideshow">


                <!-- =============================
                     SLIDE 1 - RAM
                ============================== -->

                <section class="photo-card slide active">

                    <div class="card-title">
                        श्री राम
                    </div>

                    <div class="image-box">

                        <img
                            src="./lord_ram.jpg"
                            alt="Lord Ram"
                            class="ram-image">

                    </div>

                </section>


                <!-- =============================
                     SLIDE 2 - GANAPATI
                ============================== -->

                <section class="photo-card slide">

                    <div class="card-title">
                        गणपती बाप्पा मोरया
                    </div>

                    <div class="image-box">

                        <img
                            src="./ganapati.jpeg"
                            alt="Lord Ganapati"
                            class="ganapati-image">

                    </div>

                </section>


                <!-- =============================
                     SLIDE 3
                ============================== -->

                <section class="photo-card slide">

                    <div class="card-title">
                        गणपती बाप्पा मोरया
                    </div>

                    <div class="image-box">

                        <img
                            src="./1.jpeg"
                            alt="Devotional Image 1">

                    </div>

                </section>


                <!-- =============================
                     SLIDE 4
                ============================== -->

                <section class="photo-card slide">

                    <div class="card-title">
                        गणपती बाप्पा मोरया
                    </div>

                    <div class="image-box">

                        <img
                            src="./2.jpeg"
                            alt="Devotional Image 2">

                    </div>

                </section>


                <!-- =============================
                     SLIDE 5
                ============================== -->

                <section class="photo-card slide">

                    <div class="card-title">
                        गणपती बाप्पा मोरया
                    </div>

                    <div class="image-box">

                        <img
                            src="./3.jpeg"
                            alt="Devotional Image 3">

                    </div>

                </section>


                <!-- =============================
                     FINAL COLLAGE
                     RAM + GANAPATI ONLY
                ============================== -->

                <section class="photo-card slide collage-slide">

                    <div class="card-title">
                        श्री राम • गणपती बाप्पा 🙏
                    </div>

                    <div class="ram-ganapati-collage">

                        <div class="collage-photo">

                            <img
                                src="./lord_ram.jpg"
                                alt="Lord Ram">

                        </div>

                        <div class="collage-photo">

                            <img
                                src="./ganapati.jpeg"
                                alt="Lord Ganapati">

                        </div>

                    </div>

                </section>

            </div>


            <!-- Previous -->

            <button
                class="slide-button prev"
                id="prevBtn"
                aria-label="Previous slide">

                ❮

            </button>


            <!-- Next -->

            <button
                class="slide-button next"
                id="nextBtn"
                aria-label="Next slide">

                ❯

            </button>


            <!-- Dots -->

            <div
                class="slide-dots"
                id="slideDots">
            </div>

        </main>


        <!-- =================================
             DIYAS
        ================================== -->

        <div class="diyas">

            <div class="diya">
                🪔
            </div>

            <div class="diya">
                🪔
            </div>

        </div>


        <!-- =================================
             MESSAGE
        ================================== -->

        <section class="message">

            <h2>
                श्री राम
            </h2>

            <p>
                सत्य • धर्म • मर्यादा • शौर्य
            </p>

            <div class="stars">
                ✦ ✧ ✦
            </div>

        </section>


        <!-- =================================
             FOOTER
        ================================== -->

        <footer class="footer">
            🌸 शुभ दर्शन 🌸
        </footer>


        <!-- =================================
             ROSE PETALS
        ================================== -->

        <div id="petal-container"></div>

    </div>


    <script src="./script.js"></script>

</body>

</html>
