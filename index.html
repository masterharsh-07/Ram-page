<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#8b250f">

    <title>॥ श्री राम ॥ | Jai Shree Ram</title>


    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">


    <!-- CSS -->

    <link rel="stylesheet"
          href="style.css">

</head>


<body>

    <div class="page">


        <!-- =========================================
             BACKGROUND
        ========================================== -->

        <div class="background-glow"></div>

        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>


        <!-- =========================================
             HEADER
        ========================================== -->

        <header class="header">

            <div class="om">
                ॐ
            </div>

            <h1>
                ॥ श्री राम ॥
            </h1>

            <p class="jai-ram">
                जय श्री राम 🙏
            </p>

        </header>


        <!-- =========================================
             PHOTO SECTION
        ========================================== -->

        <main class="photo-area">


            <!-- =====================================
                 LORD RAM - LEFT
            ====================================== -->

            <section class="photo-card ram-card">

                <div class="card-title">
                    श्री राम
                </div>

                <div class="image-box">

                    <img
                        src="./lord_ram.jpg"
                        alt="Lord Ram"
                        class="ram-image"
                    >

                </div>

            </section>


            <!-- =====================================
                 GANAPATI - RIGHT
            ====================================== -->

            <section class="photo-card ganapati-card">

                <div class="card-title">
                    ओकांचा गणपती
                </div>

                <div class="image-box">

                    <img
                        src="./Ganapati.jpeg"
                        alt="Lord Ganapati"
                        class="ganapati-image"
                    >

                </div>

            </section>


        </main>


        <!-- =========================================
             DIYAS
        ========================================== -->

        <div class="diya diya-left">
            🪔
        </div>

        <div class="diya diya-right">
            🪔
        </div>


        <!-- =========================================
             BOTTOM MESSAGE
        ========================================== -->

        <section class="message">

            <h2>
                श्री राम
            </h2>

            <p>
                सत्य • धर्म • मर्यादा • शौर्य
            </p>

            <div class="stars">
                ✦ &nbsp; ✦ &nbsp; ✦
            </div>

        </section>


        <!-- =========================================
             FOOTER
        ========================================== -->

        <footer class="footer">

            🌸 शुभ दर्शन 🌸

        </footer>


        <!-- =========================================
             FALLING ROSE PETALS
        ========================================== -->

        <div id="petal-container"></div>


    </div>


    <!-- JavaScript -->

    <script src="./script.js"></script>

</body>

</html>
